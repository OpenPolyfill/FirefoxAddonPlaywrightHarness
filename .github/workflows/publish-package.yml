name: Publish package

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-publish
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm version that supports trusted publishing
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Verify and build package
        run: |
          npm run verify
          npm run build
          npm run pack:check

      - name: Check whether the version exists
        id: check-npm-version
        run: |
          package_spec="$(node -e 'const pkg = require("./package.json"); console.log(pkg.name + "@" + pkg.version)')"
          if output="$(npm view "$package_spec" version --registry=https://registry.npmjs.org 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$output" == *"E404"* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$output" >&2
            exit 1
          fi

      - name: Publish to npmjs
        if: steps.check-npm-version.outputs.exists != 'true'
        run: npm publish --registry=https://registry.npmjs.org --access public

  publish-github:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci

      - name: Verify and build package
        run: |
          npm run verify
          npm run build
          npm run pack:check

      - name: Check whether the version exists
        id: check-github-version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_spec="$(node -e 'const pkg = require("./package.json"); console.log(pkg.name + "@" + pkg.version)')"
          if output="$(npm view "$package_spec" version --registry=https://npm.pkg.github.com 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$output" == *"E404"* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$output" >&2
            exit 1
          fi

      - name: Publish to GitHub Packages
        if: steps.check-github-version.outputs.exists != 'true'
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
